name: update
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    paths: [merge.py]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python merge.py AdBlock.sgmodule
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add AdBlock.sgmodule
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git push)
